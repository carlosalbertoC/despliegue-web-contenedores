# Entorno local de tres contenedores.
# Solo el proxy publica un puerto. La base queda en la red interna "datos".

name: portal-acceso

services:
  proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: portal-proxy:1.0.0
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - web
    restart: unless-stopped

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: portal-acceso:1.0.0
    environment:
      PORT: "3000"
      NODE_ENV: production
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
      - datos
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/salud').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - datos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 20s
    restart: unless-stopped

networks:
  web:
  datos:

volumes:
  pgdata:
