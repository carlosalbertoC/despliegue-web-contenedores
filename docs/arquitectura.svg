<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Arquitectura local de tres contenedores</title>
  <desc id="desc">El usuario entra por Nginx en el puerto 80. Nginx reenvía a la aplicación y solo la aplicación llega a PostgreSQL, cuyos datos viven en un volumen.</desc>
  <style>
    text { font-family: "Segoe UI", sans-serif; }
  </style>
  <rect width="980" height="520" fill="#f6f3ec"/>
  <text x="40" y="46" fill="#14312e" font-size="22" font-weight="700">Arquitectura local  portal de acceso</text>
  <text x="40" y="74" fill="#3d4a44" font-size="15">Opción A en la nube: el HTTPS lo entrega Blitz y PostgreSQL 17 es administrado.</text>

  <rect x="40" y="110" width="170" height="92" rx="8" fill="#14312e"/>
  <text x="125" y="152" text-anchor="middle" fill="#f6f3ec" font-size="18" font-weight="700">Usuario</text>
  <text x="125" y="176" text-anchor="middle" fill="#f0d7a2" font-size="13">navegador</text>

  <line x1="210" y1="156" x2="268" y2="156" stroke="#0c5c56" stroke-width="3"/>
  <polygon points="268,150 282,156 268,162" fill="#0c5c56"/>
  <text x="246" y="144" text-anchor="middle" fill="#0c5c56" font-size="12">HTTP</text>

  <rect x="282" y="110" width="190" height="92" rx="8" fill="#0c5c56"/>
  <text x="377" y="146" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Nginx 1.27.5</text>
  <text x="377" y="170" text-anchor="middle" fill="#f0d7a2" font-size="13">puerto 80 publicado</text>

  <line x1="472" y1="156" x2="530" y2="156" stroke="#0c5c56" stroke-width="3"/>
  <polygon points="530,150 544,156 530,162" fill="#0c5c56"/>

  <rect x="544" y="110" width="190" height="92" rx="8" fill="#0c5c56"/>
  <text x="639" y="146" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Aplicación</text>
  <text x="639" y="170" text-anchor="middle" fill="#f0d7a2" font-size="13">Node.js, sin puerto público</text>

  <line x1="734" y1="156" x2="792" y2="156" stroke="#0c5c56" stroke-width="3"/>
  <polygon points="792,150 806,156 792,162" fill="#0c5c56"/>

  <rect x="806" y="110" width="140" height="92" rx="8" fill="#14312e"/>
  <text x="876" y="146" text-anchor="middle" fill="#f6f3ec" font-size="16" font-weight="700">PostgreSQL</text>
  <text x="876" y="170" text-anchor="middle" fill="#f0d7a2" font-size="13">17.6, sin puerto</text>

  <rect x="282" y="250" width="452" height="78" rx="8" fill="none" stroke="#0c5c56" stroke-dasharray="7 6"/>
  <text x="508" y="294" text-anchor="middle" fill="#0c5c56" font-size="16" font-weight="700">Red web</text>
  <text x="508" y="314" text-anchor="middle" fill="#3d4a44" font-size="13">Nginx y la aplicación. El proxy no ve la base.</text>

  <rect x="544" y="348" width="402" height="78" rx="8" fill="none" stroke="#8a5a12" stroke-dasharray="7 6"/>
  <text x="745" y="384" text-anchor="middle" fill="#8a5a12" font-size="16" font-weight="700">Red datos</text>
  <text x="745" y="404" text-anchor="middle" fill="#3d4a44" font-size="13">Solo la aplicación consulta PostgreSQL.</text>

  <rect x="40" y="348" width="470" height="78" rx="8" fill="#14312e"/>
  <text x="275" y="380" text-anchor="middle" fill="#f6f3ec" font-size="16" font-weight="700">Volumen pgdata</text>
  <text x="275" y="404" text-anchor="middle" fill="#f0d7a2" font-size="13">Los usuarios siguen ahí si se recrea el contenedor de la base.</text>
</svg>
